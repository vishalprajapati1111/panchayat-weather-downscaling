# environment.yml — conda environment (recommended on Linux/macOS)
# Python: 3.12.10 | GDAL: 3.12.4 | PROJ: 9.5.1
#
# Create:   conda env create -f environment.yml
# Activate: conda activate panchayat-downscale

name: panchayat-downscale
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - rasterio=1.5.1
  - xarray=2026.7.0
  - zarr=2.18.7
  - numpy=2.3.5
  - pandas=3.0.3
  - pyproj=3.7.2
  - scipy=1.18.0
  - matplotlib=3.11.1
  - shapely=2.1.2
  - tqdm=4.68.3
  - fsspec=2026.7.0
  - gcsfs=2026.8.0
  - requests=2.34.2
  - pip
  - pip:
    - earthengine-api==1.7.41
